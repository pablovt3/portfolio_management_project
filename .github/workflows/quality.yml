name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the study
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the core library
        run: python -m pip install git+https://github.com/pablovt3/portfolio_management_module.git@main

      - name: Install the study
        run: python -m pip install -e '.[dev,dashboard,report]'

      - name: Lint
        run: ruff check src tests scripts dashboard

      - name: Type check
        run: mypy src scripts dashboard

      - name: Test with branch coverage
        run: pytest --cov=portfolio_management_project --cov-branch
