[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-management-project"
version = "1.0.0"
description = "Reproducible global multi-asset portfolio research built on portfolio-management-module."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Pablo Valdes" }
]
dependencies = [
    "pandas>=2.2",
    "portfolio-management-module>=0.1.0",
    "PyYAML>=6.0",
    "plotly>=6.0"
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4.0"]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "ipykernel>=6.0"
]
dashboard = [
    "streamlit>=1.49"
]
report = [
    "matplotlib>=3.8"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["portfolio_management_project"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
